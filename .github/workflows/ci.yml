name: CI

on:
  push:
    branches: [main, master, master1]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 失败时把**每条** FAILED/ERROR 变成 GitHub annotation ——
      # 否则日志藏在折叠面板里，手机上根本看不到（2026-10-21 排查 CI 时踩的）。
      - name: 跑全量测试
        shell: bash
        run: |
          set -o pipefail
          # `-o addopts=''` + `/tmp` 的 basetemp（2026-10-22，CI 第二个坑）：
          # `pytest.ini` 里写的是 `--basetemp=.pip-tmp/pytest`，而
          # `.pip-tmp/` 在 .gitignore 里 —— 干净 checkout 上它不存在，
          # Linux 上跑到第 90 个用例开始 `tmp_path` 全报
          # `FileNotFoundError: .../.pip-tmp/pytest`（20 个 ERROR，退出 1）。
          # 把 basetemp 挪到 /tmp 就与仓库目录彻底无关了。
          python -m pytest -q -o addopts='' --basetemp=/tmp/sg-pt \
            --tb=line --maxfail=20 2>&1 | tee /tmp/pytest.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "----- 尾部 -----"
            tail -30 /tmp/pytest.log
            # **写进 Job Summary**（2026-10-22）：
            # `::error::` 那套在 PR 页面上没渲染出来（试了两轮，annotation 里
            # 只有 "Process completed with exit code 1"）。而 Job Summary
            # 是 job 页面顶部的一整块 markdown，日志折叠也挡不住它 ——
            # 排查 CI 时至少能看见"哪几条失败"。
            {
              echo "## pytest 失败（Python ${{ matrix.python-version }}）"
              echo ''
              echo '```'
              grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -30 \
                || tail -30 /tmp/pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 再兜一次：**不带 title** 的 `::error::`（带 title 的那版在 run 页面上
            # 从来没渲染出来过）。`%` `\r` `\n` 按 GitHub 的转义规则处理。
            # 这样即使 Job Summary 那块看不到，annotation 里也有具体是哪条。
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -15 | \
              while IFS= read -r line; do
                safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
                printf '::error::%s\n' "$safe"
              done
          fi
          exit "$rc"

      # 备份一道"端到端"检查：退出码就是结论（0 通过 / 1 有错误 / 2 用法问题）。
      # 用仓库自带的 demo 工程，不需要外部项目。
      - name: 体检示例工程（exit code 即结论）
        run: python cli.py validate demo

      - name: 编译示例工程（缺资源写 TODO，不中断）
        run: python cli.py compile demo/剧本表_ch01.xlsx --out /tmp/ch01.rpy

  # 保真样本：**不依赖真机项目**，也不装界面库。
  #
  # 为什么单开一个 job（2026-10-23）：本仓库最硬的一句承诺是"没改的行一个字节
  # 都不变"，但在此之前，能跑这句承诺的测试**全部** `skipif(not REAL)` ——
  # 换一台机器（或 fork 的人），它就一点证据都没有。这个 job 的输入是
  # `tests/fixtures/fidelity/` 里 4 份真实结构样本（python 块 + 行尾注释 /
  # 嵌套 menu / ATL transform / 条件菜单选项），判据只有一条：逐字节相同。
  #
  # 它挡的是什么：有人改了 `patcher.py` / `beat_render.py` / `excel_*` 之后
  # "看起来还能用" —— 金标在 Linux 上是 skip，全量测试是绿的，只有这里会红。
  fidelity:
    name: 保真样本（不依赖真机项目）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 逐字节保真（样本）
        run: python -m pytest -q -o addopts='' --basetemp=/tmp/sg-fid tests/test_fidelity_structure.py

      # 报告是给人看的：贴进 Job Summary，否则失败时只有一行 exit 1。
      # `--allow-layout` 不是放水：条件菜单选项退回全量是**已知缺口**
      # （有一条用例如实钉着它），这里只让报告不把 job 判红。
      - name: 保真报告
        if: always()
        shell: bash
        run: |
          python tools/fidelity_report.py --project tests/fixtures/fidelity \
            --allow-layout --md /tmp/fidelity.md || true
          if [ -f /tmp/fidelity.md ]; then
            { echo '## 逐字节保真报告'; echo ''; cat /tmp/fidelity.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
