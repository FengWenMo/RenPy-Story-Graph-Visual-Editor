name: CI

on:
  push:
    branches: [main, master, master1]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 失败时把**每条** FAILED/ERROR 变成 GitHub annotation ——
      # 否则日志藏在折叠面板里，手机上根本看不到（2026-10-21 排查 CI 时踩的）。
      - name: 跑全量测试
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=line --maxfail=20 2>&1 | tee /tmp/pytest.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "----- 尾部 -----"
            tail -30 /tmp/pytest.log
            echo "----- 失败清单（${{ matrix.python-version }}）-----"
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -20 | \
              while IFS= read -r line; do echo "::error title=pytest::$line"; done
            # 连"一条 FAILED 都没有"的情况也要看得见（收集阶段就崩时就是这种）：
            # 把尾部原样变成 annotation，手机上也能读。
            tail -25 /tmp/pytest.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=pytest-tail::$line"
            done
          fi
          exit "$rc"

      # 备份一道"端到端"检查：退出码就是结论（0 通过 / 1 有错误 / 2 用法问题）。
      # 用仓库自带的 demo 工程，不需要外部项目。
      - name: 体检示例工程（exit code 即结论）
        run: python cli.py validate demo

      - name: 编译示例工程（缺资源写 TODO，不中断）
        run: python cli.py compile demo/剧本表_ch01.xlsx --out /tmp/ch01.rpy
