name: CI

on:
  push:
    branches: [main, master, master1]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 失败时把**每条** FAILED/ERROR 变成 GitHub annotation ——
      # 否则日志藏在折叠面板里，手机上根本看不到（2026-10-21 排查 CI 时踩的）。
      - name: 跑全量测试
        shell: bash
        run: |
          set -o pipefail
          # `-o addopts=''` + `/tmp` 的 basetemp（2026-10-22，CI 第二个坑）：
          # `pytest.ini` 里写的是 `--basetemp=.pip-tmp/pytest`，而
          # `.pip-tmp/` 在 .gitignore 里 —— 干净 checkout 上它不存在，
          # Linux 上跑到第 90 个用例开始 `tmp_path` 全报
          # `FileNotFoundError: .../.pip-tmp/pytest`（20 个 ERROR，退出 1）。
          # 把 basetemp 挪到 /tmp 就与仓库目录彻底无关了。
          python -m pytest -q -o addopts='' --basetemp=/tmp/sg-pt \
            --tb=line --maxfail=20 2>&1 | tee /tmp/pytest.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "----- 尾部 -----"
            tail -30 /tmp/pytest.log
            # **写进 Job Summary**（2026-10-22）：
            # `::error::` 那套在 PR 页面上没渲染出来（试了两轮，annotation 里
            # 只有 "Process completed with exit code 1"）。而 Job Summary
            # 是 job 页面顶部的一整块 markdown，日志折叠也挡不住它 ——
            # 排查 CI 时至少能看见"哪几条失败"。
            {
              echo "## pytest 失败（Python ${{ matrix.python-version }}）"
              echo ''
              echo '```'
              grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -30 \
                || tail -30 /tmp/pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # 备份一道"端到端"检查：退出码就是结论（0 通过 / 1 有错误 / 2 用法问题）。
      # 用仓库自带的 demo 工程，不需要外部项目。
      - name: 体检示例工程（exit code 即结论）
        run: python cli.py validate demo

      - name: 编译示例工程（缺资源写 TODO，不中断）
        run: python cli.py compile demo/剧本表_ch01.xlsx --out /tmp/ch01.rpy
