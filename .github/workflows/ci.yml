name: CI

on:
  push:
    branches: [main, master, master1]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 跑全量测试
        run: python -m pytest -q

      # 备份一道"端到端"检查：退出码就是结论（0 通过 / 1 有错误 / 2 用法问题）。
      # 用仓库自带的 demo 工程，不需要外部项目。
      - name: 体检示例工程（exit code 即结论）
        run: python cli.py validate demo

      - name: 编译示例工程（缺资源写 TODO，不中断）
        run: python cli.py compile demo/剧本表_ch01.xlsx --out /tmp/ch01.rpy
