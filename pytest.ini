[pytest]
# 源码是 storygraph 包；conftest.py 把项目根塞进 sys.path 以便导入它
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 临时目录固定到仓库内，且**每次运行前清空**（--basetemp 的语义）。
# 系统 TEMP 下的 pytest-of-* 曾经累积近万个文件，让整个套件越跑越慢、
# 中途像"卡住"一样超时（2026-09-29 实测：200s 只跑到 63%，而每个文件
# 单独跑都正常）。.pip-tmp/ 已在 .gitignore 里，不会污染仓库。
addopts = --basetemp=.pip-tmp/pytest

# 代码里的 docstring 若写出非法转义（如 '\w'），直接算失败，
# 避免像 renpy_parser 的模块 docstring 那样长期挂着 SyntaxWarning
filterwarnings =
    error::SyntaxWarning
    error::DeprecationWarning:.*renpy_parser

# 失败的断言输出别再被省略号吃掉
verbosity_assertions = 2
