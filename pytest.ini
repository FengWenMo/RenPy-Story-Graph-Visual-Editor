[pytest]
# 源码是扁平导入（非包结构），靠 conftest.py 把根目录塞进 sys.path
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 代码里的 docstring 若写出非法转义（如 '\w'），直接算失败，
# 避免像 renpy_parser 的模块 docstring 那样长期挂着 SyntaxWarning
filterwarnings =
    error::SyntaxWarning
    error::DeprecationWarning:renpy_parser

# 失败的断言输出别再被省略号吃掉
verbosity_assertions = 2
